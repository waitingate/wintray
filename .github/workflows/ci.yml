name: CI

# Tags are left out: a tag points at a commit that already ran on main.
on:
  push:
    branches: [main]
  pull_request:

# The jobs only read the code: a read-only token, which checkout doesn't keep.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15                 # a run takes under a minute; without a limit a hung step runs 6 hours
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install MinGW-w64
        timeout-minutes: 12
        run: |
          # Only the two compilers the build uses.
          pkgs="gcc-mingw-w64-x86-64-win32 gcc-mingw-w64-i686-win32"
          apt="apt-get -y --no-install-recommends"
          sudo $apt update
          # Azure's mirror sometimes sends these 120 MB at about 100 KB/s, and apt has
          # no minimum speed. If the download fails or takes over a minute, Ubuntu's
          # main archive goes first in the image's mirror list, and the image's own
          # mirrors stay behind it as fallbacks (apt reads the priority only after a
          # tab). Only the download is timed, so the limit never stops dpkg halfway.
          # Under sudo, timeout also signals apt's download processes, which then
          # leave a half-fetched file ready to resume.
          if ! sudo timeout 60 $apt install --download-only $pkgs; then
            printf 'http://archive.ubuntu.com/ubuntu/\tpriority:0\n' | sudo tee -a /etc/apt/apt-mirrors.txt
          fi
          sudo $apt install $pkgs
      - name: Build for Windows, 64 and 32 bit
        run: |
          for t in x86_64 i686; do
            $t-w64-mingw32-gcc-win32 -std=c99 -Os -Wall -Wextra -Wpedantic -Werror -c wintray.c -o wintray-$t.o
            # No C runtime: the object must link with nothing but these three Windows DLLs.
            # (ld warns that the DLL has no entry point; nothing ever runs it.)
            $t-w64-mingw32-gcc-win32 -shared -nostdlib -o wintray-$t.dll wintray-$t.o -lkernel32 -luser32 -lshell32
          done

  # The logic tests need only the runner's own gcc, so they don't wait for MinGW.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Run the tests
        run: |
          sudo sysctl vm.mmap_rnd_bits=28   # AddressSanitizer fails with more on newer kernels
          sh test/run.sh
      - name: Check that README.md's API section is a copy of wintray.h
        if: ${{ !cancelled() }}             # also when the tests failed
        run: |
          # Everything inside extern "C" against the code block under "## API".
          awk '/^extern "C"/ {on = 1; next} on && /^#ifdef __cplusplus/ {exit} on && !/^#endif/' wintray.h > api-h.txt
          awk '/^## API/ {api = 1} api && /^```/ {if (on) exit; on = 1; next} on' README.md > api-r.txt
          test -s api-h.txt && test -s api-r.txt && diff -B api-h.txt api-r.txt
