name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15                 # a run takes about 2 minutes; without a limit a hung step runs 6 hours
    steps:
      - uses: actions/checkout@v4
      - name: Install MinGW-w64
        run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64
      - name: Build for Windows, 64 and 32 bit
        run: |
          for t in x86_64 i686; do
            $t-w64-mingw32-gcc -std=c99 -Os -Wall -Wextra -Wpedantic -Werror -c wintray.c -o wintray-$t.o
            # No C runtime: the object must link with nothing but these three Windows DLLs.
            # (ld warns that the DLL has no entry point; nothing ever runs it.)
            $t-w64-mingw32-gcc -shared -nostdlib -o wintray-$t.dll wintray-$t.o -lkernel32 -luser32 -lshell32
          done
      - name: Run the tests
        run: |
          sudo sysctl vm.mmap_rnd_bits=28   # AddressSanitizer fails with more on newer kernels
          sh test/run.sh
